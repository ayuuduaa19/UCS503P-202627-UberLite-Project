services:
  # ============================================================================
  # PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: uberlite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-uberlite}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-uberlite}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uberlite-network

  # ============================================================================
  # Express Backend Service
  # ============================================================================
  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: uberlite-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-uberlite}?schema=public
      JWT_SECRET: ${JWT_SECRET:-uberlite-demo-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - uberlite-network

  # ============================================================================
  # React Frontend Service (Served via Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./code/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: uberlite-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - uberlite-network

networks:
  uberlite-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
