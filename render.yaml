# ==============================================================================
# UberLite Render Blueprint Deployment Specification
# https://render.com/docs/blueprint-spec
# ==============================================================================
version: "1"

databases:
  - name: uberlite-db
    databaseName: uberlite
    user: uberlite_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  # ----------------------------------------------------------------------------
  # Backend Express API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: uberlite-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: code/backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm run prisma:seed && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: uberlite-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"

  # ----------------------------------------------------------------------------
  # Frontend React Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: uberlite-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: code/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: uberlite-backend
          property: host
